<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إتمام الطلب | بطلي</title>
<link rel="shortcut icon" href="images/logo-mark1.png" type="image/x-icon">
<link rel="stylesheet" href="shared/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.page-header{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--clr-paper);box-shadow:var(--shadow-soft);position:sticky;top:0;z-index:20;}
.back-link{display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem;color:var(--clr-ink-soft);}
.back-link:hover{color:var(--clr-primary);}
.page-footer{text-align:center;padding:26px 20px;color:var(--clr-ink-soft);font-size:.82rem;}
html,body{overflow-x:hidden;max-width:100%;}
input,select,textarea{max-width:100%;}

.progress-wrap{margin-bottom:22px;}
.progress-label{font-size:.85rem;font-weight:800;color:var(--clr-primary);margin-bottom:8px;}
.progress-bar{height:8px;border-radius:100px;background:var(--clr-cream);overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--clr-primary),var(--clr-primary-dark));border-radius:100px;transition:width .3s;}

.section-title-sm{font-size:1.05rem;font-weight:900;margin:22px 0 4px;color:var(--clr-primary);}
.field-error{color:var(--clr-primary-dark);font-size:.78rem;margin-top:5px;display:none;}
.field-error.show{display:block;}

.phone-row input{width:100%;}
.picker-field{border:2px solid color-mix(in srgb, var(--clr-primary) 20%, transparent);border-radius:12px;padding:12px 14px;background:var(--clr-cream);cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:.95rem;}
.picker-field.placeholder{color:var(--clr-ink-soft);}
.picker-panel{display:none;position:relative;margin-top:8px;background:var(--clr-paper);border-radius:12px;box-shadow:var(--shadow-soft);padding:10px;grid-template-columns:repeat(4,1fr);gap:8px;}
.picker-panel.open{display:grid;}
.picker-panel.gender-panel{grid-template-columns:repeat(2,1fr);}
.picker-option{padding:10px 6px;border-radius:10px;text-align:center;font-size:.88rem;font-weight:700;background:var(--clr-cream);color:var(--clr-ink);transition:background .2s, color .2s;}
.picker-option:hover, .picker-option.selected{background:var(--clr-primary);color:#fff;}

.photo-guide{display:flex;gap:18px;align-items:flex-start;background:var(--clr-teal-light);border-radius:14px;padding:14px;margin-top:8px;}
.photo-guide img{width:150px;height:150px;object-fit:cover;border-radius:12px;flex-shrink:0;cursor:pointer;transition:transform .2s;}
.photo-guide img:hover{transform:scale(1.03);}
.photo-guide .tips-cols{display:flex;gap:18px;flex:1;}
.photo-guide ul{padding-inline-start:18px;font-size:.82rem;color:var(--clr-ink);line-height:1.9;flex:1;}
.photo-guide .cap{font-size:.72rem;font-weight:800;color:var(--clr-teal);text-align:center;margin-top:6px;}
.lightbox{position:fixed;inset:0;background:rgba(20,12,8,.75);display:none;align-items:center;justify-content:center;z-index:100;padding:20px;}
.lightbox.open{display:flex;}
.lightbox img{max-width:min(90vw,420px);max-height:80vh;border-radius:14px;}

.consent-row{display:flex;align-items:flex-start;gap:10px;margin-top:20px;background:var(--clr-cream);padding:14px;border-radius:12px;}
.consent-row input{width:auto;margin-top:3px;accent-color:var(--clr-primary);}
.consent-row label{margin:0;font-weight:500;font-size:.85rem;line-height:1.8;}

/* منتقي القيم الهرمي */
.value-selected-banner{display:none;align-items:center;justify-content:space-between;gap:10px;background:var(--clr-teal-light);color:var(--clr-teal);border-radius:12px;padding:12px 16px;margin-bottom:10px;font-weight:700;font-size:.88rem;}
.value-selected-banner.show{display:flex;}
.value-selected-banner button{font-size:.78rem;text-decoration:underline;color:var(--clr-teal);flex-shrink:0;}
.value-accordion{border-radius:14px;overflow:hidden;border:2px solid color-mix(in srgb, var(--clr-primary) 15%, transparent);}
.value-cat{border-bottom:1px solid color-mix(in srgb, var(--clr-ink) 8%, transparent);}
.value-cat:last-child{border-bottom:none;}
.value-cat-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;background:var(--clr-paper);font-weight:700;font-size:.9rem;transition:background .2s;}
.value-cat-head:hover{background:var(--clr-cream);}
.value-cat-head .vleft{display:flex;align-items:center;gap:10px;}
.value-cat-head .vcheck{width:18px;height:18px;border-radius:50%;background:var(--clr-teal);color:#fff;font-size:.7rem;display:none;align-items:center;justify-content:center;flex-shrink:0;}
.value-cat.has-selection .vcheck{display:flex;}
.value-cat-head .chev{transition:transform .25s;color:var(--clr-ink-soft);flex-shrink:0;}
.value-cat.open .chev{transform:rotate(180deg);}
.value-cat.has-selection .value-cat-head{background:color-mix(in srgb, var(--clr-primary) 6%, transparent);}
.value-cat-body{max-height:0;overflow:hidden;transition:max-height .35s ease;background:var(--clr-cream);}
.value-cat.open .value-cat-body{max-height:700px;}
.value-chip-grid{display:flex;flex-wrap:wrap;gap:8px;padding:14px 16px;}
.value-chip{padding:8px 14px;border-radius:100px;background:var(--clr-paper);font-size:.83rem;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .2s;}
.value-chip:hover{border-color:var(--clr-primary);}
.value-chip.selected{background:var(--clr-primary);color:#fff;}
.value-other-row{padding:14px 16px;cursor:pointer;font-weight:700;font-size:.9rem;display:flex;align-items:center;gap:10px;background:var(--clr-paper);transition:background .2s;}
.value-other-row:hover{background:var(--clr-cream);}
.value-other-row.selected{background:color-mix(in srgb, var(--clr-primary) 10%, transparent);color:var(--clr-primary);}

/* بطاقات الإهداء */
.dedication-option{border:2px solid color-mix(in srgb, var(--clr-primary) 15%, transparent);border-radius:14px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .2s;}
.dedication-option:hover{border-color:var(--clr-primary);}
.dedication-option.selected{border-color:var(--clr-primary);background:color-mix(in srgb, var(--clr-primary) 6%, transparent);}
.dedication-option .d-title{font-weight:800;font-size:.92rem;display:flex;align-items:center;gap:8px;}
.dedication-option .d-body{margin-top:10px;display:none;}
.dedication-option.selected .d-body{display:block;}
.dedication-default-text{background:var(--clr-cream);border-radius:10px;padding:12px 14px;font-size:.85rem;line-height:2;color:var(--clr-ink);}

.wizard-nav{display:flex;gap:12px;margin-top:26px;}
.wizard-nav .btn{flex:1;}

.review-item{background:var(--clr-cream);border-radius:12px;padding:14px 16px;margin-bottom:10px;font-size:.87rem;line-height:1.9;}
.review-item b{color:var(--clr-primary);}
.edit-link{font-size:.78rem;color:var(--clr-teal);text-decoration:underline;cursor:pointer;}
.price-row{display:flex;justify-content:space-between;font-size:.9rem;padding:5px 0;}
.price-row.total{font-weight:900;font-size:1.1rem;color:var(--clr-primary);border-top:1px dashed color-mix(in srgb, var(--clr-ink) 15%, transparent);padding-top:10px;margin-top:6px;}

@media(max-width:640px){
  .container{padding:14px;}
  .card{padding:18px;}
  .photo-guide{flex-direction:column;align-items:center;text-align:center;}
  .photo-guide img{width:120px;height:120px;}
  .photo-guide .tips-cols{flex-direction:column;gap:6px;width:100%;text-align:right;}
  .picker-panel{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>
<body>

<div class="page-header">
  <a href="index.html" class="brand" style="margin:0;"><img src="images/logo-icon.png" alt="بطلي" style="height:32px;"></a>
  <a href="#" id="backBtn" class="back-link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
    رجوع
  </a>
</div>

<div class="container">
  <div class="card">
    <div class="progress-wrap">
      <div class="progress-label" id="progressLabel">جاري التحميل...</div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
    </div>
    <div id="stepContent"></div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()"><img src="images/child-photo.webp" alt="مثال"></div>

<div class="page-footer">© 2026 منصة بطلي — <a href="index.html" style="text-decoration:underline;">العودة للصفحة الرئيسية</a></div>

<script src="shared/config.js"></script>
<script src="shared/drive-upload.js"></script>
<script>
document.getElementById('backBtn').addEventListener('click', (e) => {
  e.preventDefault();
  if (document.referrer) window.history.back(); else window.location.href = 'index.html';
});
function openLightbox(){ document.getElementById('lightbox').classList.add('open'); }
function closeLightbox(){ document.getElementById('lightbox').classList.remove('open'); }

/* ---------- الحالة العامة ---------- */
const pendingItems = JSON.parse(localStorage.getItem('batali_pending_items') || '[]');
const couponCode = localStorage.getItem('batali_coupon_code') || '';
const stepContent = document.getElementById('stepContent');
const progressLabel = document.getElementById('progressLabel');
const progressFill = document.getElementById('progressFill');

// استرجاع تقدّم محفوظ سابقاً إن وُجد (نفس عدد المنتجات)
const saved = JSON.parse(localStorage.getItem('batali_wizard_progress') || 'null');
let parentInfo = (saved && saved.pendingItemsCount === pendingItems.length) ? saved.parentInfo : {};
let itemsData = (saved && saved.pendingItemsCount === pendingItems.length) ? saved.itemsData : pendingItems.map(() => ({}));
let currentStep = 0; // 0 = بيانات ولي الأمر، 1..N = عناصر، N+1 = مراجعة

const TOTAL_STEPS = pendingItems.length + 2;

function saveProgress(){
  localStorage.setItem('batali_wizard_progress', JSON.stringify({ pendingItemsCount: pendingItems.length, parentInfo, itemsData }));
}

function updateProgress(){
  const pct = Math.round((currentStep / (TOTAL_STEPS - 1)) * 100);
  progressFill.style.width = pct + '%';
  if (currentStep === 0) progressLabel.textContent = 'بيانات ولي الأمر';
  else if (currentStep <= pendingItems.length) progressLabel.textContent = `تخصيص المنتج ${currentStep} من ${pendingItems.length}`;
  else progressLabel.textContent = 'مراجعة الطلب وإرسال';
}

if (pendingItems.length === 0) {
  stepContent.innerHTML = `<p style="text-align:center;color:var(--clr-ink-soft);padding:30px 0;">لا توجد منتجات لإتمام الطلب — الرجاء العودة للموقع واختيار قصة أولاً.</p>
    <a href="index.html" class="btn btn-block">العودة للصفحة الرئيسية</a>`;
  progressLabel.textContent = 'لا يوجد طلب';
} else {
  renderStep();
}

function renderStep(){
  updateProgress();
  if (currentStep === 0) renderParentStep();
  else if (currentStep <= pendingItems.length) renderItemStep(currentStep - 1);
  else renderReviewStep();
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- خطوة بيانات ولي الأمر ---------- */
function renderParentStep(){
  stepContent.innerHTML = `
    <div class="section-title-sm">بيانات ولي الأمر</div>
    <label class="required">اسم ولي الأمر</label>
    <input type="text" id="parentName" placeholder="الاسم الثلاثي أو الرباعي" value="${parentInfo.parentName||''}">
    <div class="field-error" id="err_parentName">الرجاء إدخال اسم ولي الأمر</div>

    <label class="required">رقم جوال الواتساب</label>
    <div class="phone-row"><input type="tel" id="phone" placeholder="77xxxxxxx" inputmode="numeric" value="${parentInfo.phone||''}"></div>
    <div class="field-error" id="err_phone">الرجاء إدخال رقم جوال صحيح (أرقام فقط)</div>

    <label>البريد الإلكتروني (اختياري)</label>
    <input type="email" id="email" placeholder="example@email.com" value="${parentInfo.email||''}">

    <label class="required">المحافظة</label>
    <input type="text" id="governorate" placeholder="مثال: صنعاء" value="${parentInfo.governorate||''}">
    <div class="field-error" id="err_governorate">الرجاء إدخال المحافظة</div>

    <label class="required">المدينة</label>
    <input type="text" id="city" placeholder="مثال: حدة" value="${parentInfo.city||''}">
    <div class="field-error" id="err_city">الرجاء إدخال المدينة</div>

    <div class="wizard-nav">
      <button class="btn" id="nextBtn">التالي</button>
    </div>
  `;
  const phoneInput = document.getElementById('phone');
  phoneInput.addEventListener('input', () => { phoneInput.value = phoneInput.value.replace(/[^0-9]/g,''); });

  document.getElementById('nextBtn').addEventListener('click', () => {
    const parentName = document.getElementById('parentName').value.trim();
    const phone = phoneInput.value.trim();
    const governorate = document.getElementById('governorate').value.trim();
    const city = document.getElementById('city').value.trim();
    let ok = true;
    toggleErr('err_parentName', !parentName); if(!parentName) ok=false;
    toggleErr('err_phone', phone.length < 8); if(phone.length < 8) ok=false;
    toggleErr('err_governorate', !governorate); if(!governorate) ok=false;
    toggleErr('err_city', !city); if(!city) ok=false;
    if(!ok) return;
    parentInfo = { parentName, phone, email: document.getElementById('email').value.trim(), governorate, city };
    saveProgress();
    currentStep++;
    renderStep();
  });
}
function toggleErr(id, cond){ document.getElementById(id).classList.toggle('show', cond); }

/* ---------- بيانات القيم الهرمية ---------- */
const VALUE_CATEGORIES = [
  { icon:'🕌', name:'القيم الدينية', items:['المحافظة على الصلاة','التعلق بالقرآن الكريم','زيادة حب الله ورسوله ﷺ','التقرب إلى الله بالأعمال الصالحة'] },
  { icon:'👨‍👩‍👧', name:'القيم الأسرية', items:['بر الوالدين','احترام أفراد الأسرة','مساعدة الإخوة'] },
  { icon:'🌟', name:'القيم الأخلاقية', items:['الصدق','الأمانة','حسن الأدب','الاحترام','التعاون','الكرم','مساعدة المحتاجين','التسامح','الكلمة الطيبة','الاعتذار عند الخطأ'] },
  { icon:'💪', name:'بناء الشخصية', items:['الثقة بالنفس','تحمل المسؤولية','الشجاعة','الاعتماد على النفس','الصبر'] },
  { icon:'📚', name:'التعلم والمدرسة', items:['حب الدراسة','حب القراءة','إنجاز الواجبات بالنفس','الإبداع والابتكار','اكتشاف أشياء جديدة'] },
  { icon:'🤝', name:'العلاقات الاجتماعية', items:['الصداقة الجيدة','مشاركة الألعاب مع الآخرين','حسن التواصل مع الآخرين','تقديم المساعدة للآخرين'] },
  { icon:'🌿', name:'العادات اليومية', items:['تنظيم الوقت','التغذية الصحية','الالتزام بوقت النوم','ترتيب الغرفة'] },
  { icon:'❤️', name:'المشاعر والذكاء العاطفي', items:['التحكم في الغضب','التفاؤل','اللطف مع الآخرين','تقبل الخطأ والتعلم منه'] },
  { icon:'🎨', name:'الهوايات والمهارات', items:['كرة القدم','السباحة','ركوب الدراجة','الرسم','التلوين','الأشغال اليدوية','التصوير','الخياطة','الطبخ','النشيد والغناء','التكنولوجيا','الزراعة'] },
];
const OTHER_VALUE_LABEL = 'اختيار قيمة أو هواية أخرى';
const DEFAULT_DEDICATION = `إلى بطلنا المميز
هذه القصة صُنعت خصيصًا لك، لترافقك في رحلة مليئة بالتعلّم والمرح والاكتشاف. تذكّر دائمًا أن كل خطوة تخطوها، وكل فكرة تتعلمها، وكل تحدٍ تتجاوزه، تقرّبك أكثر من أفضل نسخة من نفسك. نحن نؤمن بأن بداخلك بطلًا قادرًا على تحقيق الكثير، وهذه مجرد بداية رحلتك.`;

/* ---------- خطوة تخصيص منتج ---------- */
function renderItemStep(idx){
  const pending = pendingItems[idx];
  const data = itemsData[idx] || {};
  stepContent.innerHTML = `
    <div class="section-title-sm">تخصيص: ${pending.product_title} ${pending.copy_label||''}</div>

    <label class="required">اسم الطفل/ة الكامل</label>
    <input type="text" id="childName" placeholder="مثال: عبدالرحمن محمد" value="${data.childName||''}">
    <div class="field-error" id="err_childName">الرجاء إدخال اسم الطفل/ة</div>

    <label class="required">عمر الطفل/ة</label>
    <div class="picker-field placeholder" id="ageField" data-value="${data.childAge||''}">${data.childAge ? data.childAge+' سنوات' : 'اختر عمر الطفل/ة'}</div>
    <div class="picker-panel" id="agePanel"></div>
    <div class="field-error" id="err_age">الرجاء اختيار عمر الطفل/ة</div>

    <label class="required">جنس الطفل/ة</label>
    <div class="picker-field placeholder" id="genderField" data-value="${data.childGender||''}">${data.childGender || 'اختر جنس الطفل/ة'}</div>
    <div class="picker-panel gender-panel" id="genderPanel">
      <div class="picker-option" data-value="ولد">ولد</div>
      <div class="picker-option" data-value="بنت">بنت</div>
    </div>
    <div class="field-error" id="err_gender">الرجاء اختيار جنس الطفل/ة</div>

    <label class="required">صورة الطفل/ة</label>
    <input type="file" id="childPhotos" accept="image/*" multiple>
    <div class="field-error" id="err_photos">الرجاء رفع صورة واحدة على الأقل</div>
    <div class="photo-guide">
      <div><img src="images/child-photo.webp" alt="مثال" onclick="openLightbox()"><div class="cap">اضغط على الصورة لتكبيرها 🔍</div></div>
      <div class="tips-cols">
        <ul><li>صورة حديثة وواضحة</li><li>الوجه للأمام مباشرة</li></ul>
        <ul><li>إضاءة جيدة وطبيعية</li><li>بدون نظارات شمسية أو قبعة</li></ul>
      </div>
    </div>

    <div class="section-title-sm">القيمة أو الهواية المراد غرسها في طفلك/طفلتك <span style="color:var(--clr-primary);">*</span></div>
    <div class="value-selected-banner" id="valueBanner"><span id="valueBannerText"></span></div>
    <div class="value-accordion" id="valueAccordion"></div>
    <input type="hidden" id="storyValue" value="${data.storyValue||''}">
    <div class="field-error" id="err_value">الرجاء اختيار القيمة أو الهواية</div>
    <div id="valueOtherWrap" style="display:none;">
      <label class="required">اكتب القيمة أو الهواية التي تريدها</label>
      <input type="text" id="valueOther" placeholder="مثال: حب الرياضة، تعلم لغة جديدة، تقوية الثقة بالنفس" value="${data.storyValueOther||''}">
      <div class="field-error" id="err_valueOther">الرجاء كتابة القيمة أو الهواية</div>
    </div>

    <div class="section-title-sm">الإهداء الذي يظهر داخل القصة <span style="color:var(--clr-primary);">*</span></div>
    <div class="dedication-option" id="dedOptDefault" data-type="default">
      <div class="d-title">🎁 إهداء بطلنا المميز (الإهداء الافتراضي)</div>
      <div class="d-body"><div class="dedication-default-text">${DEFAULT_DEDICATION.replace(/\n/g,'<br>')}</div></div>
    </div>
    <div class="dedication-option" id="dedOptCustom" data-type="custom">
      <div class="d-title">✍️ كتابة إهداء خاص</div>
      <div class="d-body">
        <label class="required">اكتب إهداءك الخاص لطفلك/طفلتك</label>
        <textarea id="dedicationCustom" placeholder="اكتب هنا كلماتك الخاصة التي تريد أن تصل لطفلك/طفلتك من خلال القصة...">${data.dedicationCustom||''}</textarea>
        <div class="field-error" id="err_dedicationCustom">الرجاء كتابة نص الإهداء</div>
      </div>
    </div>
    <input type="hidden" id="dedicationType" value="${data.dedicationType||''}">
    <div class="field-error" id="err_dedication">الرجاء اختيار نوع الإهداء</div>

    <label>هل هناك هواية أو تفصيلة تحب إضافتها لشخصية الطفل/ة في القصة؟</label>
    <textarea id="hobbyDetail" placeholder="مثال: يحب كرة القدم، يحلم أن يصبح طبيباً، شخصيته مرحة ونشيطة...">${data.hobbyDetail||''}</textarea>

    <div class="wizard-nav">
      <button class="btn btn-outline" id="prevBtn">السابق</button>
      <button class="btn" id="nextBtn">التالي</button>
    </div>
  `;

  // منتقي العمر
  const ageField = document.getElementById('ageField');
  const agePanel = document.getElementById('agePanel');
  for (let age = 2; age <= 13; age++) {
    const opt = document.createElement('div');
    opt.className = 'picker-option'; opt.dataset.value = age; opt.textContent = age + ' سنوات';
    if (data.childAge == age) opt.classList.add('selected');
    agePanel.appendChild(opt);
  }
  setupPicker(ageField, agePanel, 'err_age');
  const genderField = document.getElementById('genderField');
  const genderPanel = document.getElementById('genderPanel');
  if (data.childGender) genderPanel.querySelector(`[data-value="${data.childGender}"]`)?.classList.add('selected');
  setupPicker(genderField, genderPanel, 'err_gender');

  // منتقي القيم الهرمي
  buildValueAccordion(document.getElementById('valueAccordion'), data.storyValue||'');
  if (data.storyValue && data.storyValue !== OTHER_VALUE_LABEL) {
    document.getElementById('valueBanner').classList.add('show');
    document.getElementById('valueBannerText').textContent = '✓ القيمة المختارة: ' + data.storyValue;
  }
  document.getElementById('valueOtherWrap').style.display = data.storyValue === OTHER_VALUE_LABEL ? 'block' : 'none';

  // بطاقات الإهداء
  const dedicationType = document.getElementById('dedicationType');
  if (data.dedicationType) {
    document.getElementById(data.dedicationType === 'default' ? 'dedOptDefault' : 'dedOptCustom').classList.add('selected');
  }
  document.querySelectorAll('.dedication-option').forEach(card => {
    card.addEventListener('click', (e) => {
      if (e.target.closest('textarea')) return;
      document.querySelectorAll('.dedication-option').forEach(c => c.classList.remove('selected'));
      card.classList.add('selected');
      dedicationType.value = card.dataset.type;
      toggleErr('err_dedication', false);
    });
  });

  document.getElementById('prevBtn').addEventListener('click', () => { collectItemStep(idx, false); currentStep--; renderStep(); });
  document.getElementById('nextBtn').addEventListener('click', () => { if (collectItemStep(idx, true)) { currentStep++; renderStep(); } });
}

function buildValueAccordion(container, current){
  const isOther = current === OTHER_VALUE_LABEL;
  container.innerHTML = VALUE_CATEGORIES.map((cat, ci) => {
    const hasSelection = cat.items.includes(current);
    return `
      <div class="value-cat ${hasSelection?'has-selection open':''}" data-cat="${ci}">
        <div class="value-cat-head">
          <div class="vleft"><span class="vcheck">✓</span><span>${cat.icon} ${cat.name}</span></div>
          <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </div>
        <div class="value-cat-body">
          <div class="value-chip-grid">
            ${cat.items.map(it => `<div class="value-chip ${it===current?'selected':''}" data-value="${it.replace(/"/g,'&quot;')}">${it}</div>`).join('')}
          </div>
        </div>
      </div>`;
  }).join('') + `
    <div class="value-other-row ${isOther?'selected':''}" id="valueOtherRow">
      <span>✏️</span><span>${OTHER_VALUE_LABEL}</span>
    </div>
  `;

  container.querySelectorAll('.value-cat-head').forEach(head => {
    head.addEventListener('click', () => {
      const cat = head.closest('.value-cat');
      const wasOpen = cat.classList.contains('open');
      container.querySelectorAll('.value-cat.open').forEach(c => c.classList.remove('open'));
      if (!wasOpen) cat.classList.add('open');
    });
  });
  container.querySelectorAll('.value-chip').forEach(chip => {
    chip.addEventListener('click', (e) => { e.stopPropagation(); selectStoryValue(chip.dataset.value); });
  });
  document.getElementById('valueOtherRow').addEventListener('click', () => selectStoryValue(OTHER_VALUE_LABEL));
}

function selectStoryValue(value){
  document.getElementById('storyValue').value = value;
  document.getElementById('valueOtherWrap').style.display = value === OTHER_VALUE_LABEL ? 'block' : 'none';
  const banner = document.getElementById('valueBanner');
  if (value && value !== OTHER_VALUE_LABEL) {
    banner.classList.add('show');
    document.getElementById('valueBannerText').textContent = '✓ القيمة المختارة: ' + value;
  } else {
    banner.classList.remove('show');
  }
  toggleErr('err_value', false);
  buildValueAccordion(document.getElementById('valueAccordion'), value);
}

function setupPicker(fieldEl, panelEl, errId){
  fieldEl.addEventListener('click', () => {
    document.querySelectorAll('.picker-panel.open').forEach(p => { if (p !== panelEl) p.classList.remove('open'); });
    panelEl.classList.toggle('open');
  });
  panelEl.addEventListener('click', (e) => {
    const opt = e.target.closest('.picker-option'); if (!opt) return;
    panelEl.querySelectorAll('.picker-option').forEach(o => o.classList.remove('selected'));
    opt.classList.add('selected');
    fieldEl.dataset.value = opt.dataset.value;
    fieldEl.textContent = opt.textContent;
    fieldEl.classList.remove('placeholder');
    panelEl.classList.remove('open');
    toggleErr(errId, false);
  });
}
document.addEventListener('click', (e) => {
  if (!e.target.closest('.picker-field') && !e.target.closest('.picker-panel')) {
    document.querySelectorAll('.picker-panel.open').forEach(p => p.classList.remove('open'));
  }
});

// يجمع بيانات خطوة العنصر الحالية؛ إن كان validate=true يتحقق من الإلزامي ويرجع false عند وجود خطأ
function collectItemStep(idx, validate){
  const ageField = document.getElementById('ageField');
  const genderField = document.getElementById('genderField');
  const storyValueEl = document.getElementById('storyValue');
  const dedicationType = document.getElementById('dedicationType');
  const childName = document.getElementById('childName').value.trim();
  const photosInput = document.getElementById('childPhotos');
  const existingPhotos = itemsData[idx].photoFiles;

  let ok = true;
  if (validate) {
    toggleErr('err_childName', !childName); if(!childName) ok=false;
    toggleErr('err_age', !ageField.dataset.value); if(!ageField.dataset.value) ok=false;
    toggleErr('err_gender', !genderField.dataset.value); if(!genderField.dataset.value) ok=false;
    const hasPhotos = (photosInput.files && photosInput.files.length>0) || (existingPhotos && existingPhotos.length>0);
    toggleErr('err_photos', !hasPhotos); if(!hasPhotos) ok=false;
    toggleErr('err_value', !storyValueEl.value); if(!storyValueEl.value) ok=false;
    if (storyValueEl.value === OTHER_VALUE_LABEL) {
      const other = document.getElementById('valueOther').value.trim();
      toggleErr('err_valueOther', !other); if(!other) ok=false;
    }
    toggleErr('err_dedication', !dedicationType.value); if(!dedicationType.value) ok=false;
    if (dedicationType.value === 'custom') {
      const c = document.getElementById('dedicationCustom').value.trim();
      toggleErr('err_dedicationCustom', !c); if(!c) ok=false;
    }
    if (!ok) return false;
  }

  itemsData[idx] = {
    childName,
    childAge: ageField.dataset.value,
    childGender: genderField.dataset.value,
    storyValue: storyValueEl.value,
    storyValueOther: document.getElementById('valueOther') ? document.getElementById('valueOther').value.trim() : '',
    dedicationType: dedicationType.value,
    dedicationCustom: document.getElementById('dedicationCustom') ? document.getElementById('dedicationCustom').value.trim() : '',
    hobbyDetail: document.getElementById('hobbyDetail').value.trim(),
    photoFiles: (photosInput.files && photosInput.files.length>0) ? photosInput.files : existingPhotos,
  };
  saveProgress();
  return true;
}

/* ---------- خطوة المراجعة والإرسال ---------- */
function renderReviewStep(){
  const subtotal = pendingItems.reduce((s,p)=>s+p.product_price, 0);
  let discount = 0;

  const itemsHtml = pendingItems.map((p, i) => {
    const d = itemsData[i];
    const valueLabel = d.storyValue === OTHER_VALUE_LABEL ? d.storyValueOther : d.storyValue;
    const dedicationLabel = d.dedicationType === 'default' ? 'الإهداء الافتراضي (بطلنا المميز)' : d.dedicationCustom;
    return `<div class="review-item">
      <div style="display:flex;justify-content:space-between;"><b>${p.product_title} ${p.copy_label||''}</b><span class="edit-link" onclick="editItem(${i})">تعديل</span></div>
      الطفل/ة: ${d.childName} — ${d.childAge} سنوات — ${d.childGender}<br>
      القيمة: ${valueLabel} | الإهداء: ${dedicationLabel}<br>
      الصور: ${d.photoFiles ? d.photoFiles.length : 0} صورة
    </div>`;
  }).join('');

  stepContent.innerHTML = `
    <div class="section-title-sm">مراجعة الطلب</div>
    <div class="review-item"><b>ولي الأمر:</b> ${parentInfo.parentName} — ${parentInfo.phone} — ${parentInfo.governorate} — ${parentInfo.city}</div>
    ${itemsHtml}

    <div id="couponBox" style="margin:16px 0;">
      <div style="display:flex;gap:8px;">
        <input type="text" id="couponInput" placeholder="كود الخصم (إن وجد)" value="${couponCode}">
        <button type="button" class="btn-ghost" id="applyCouponBtn" style="padding:10px 18px;white-space:nowrap;">تطبيق</button>
      </div>
      <div id="couponMsg" style="font-size:.8rem;margin-top:6px;"></div>
    </div>

    <div class="price-row"><span>السعر الأساسي</span><span id="priceSubtotal">${subtotal} ر.س</span></div>
    <div class="price-row" id="discountRow" style="display:none;color:var(--clr-teal);"><span>الخصم</span><span id="priceDiscount">0 ر.س</span></div>
    <div class="price-row total"><span>الإجمالي</span><span id="priceTotal">${subtotal} ر.س</span></div>

    <div class="consent-row">
      <input type="checkbox" id="consentPrivacy">
      <label for="consentPrivacy">أوافق على <a href="index.html#privacy" target="_blank" style="color:var(--clr-primary);text-decoration:underline;">سياسة الخصوصية</a> الخاصة بمنصة بطلي، وأؤكد أن الصور المرفوعة هي لطفلي أو بإذن ولي أمره.</label>
    </div>
    <div class="field-error" id="err_consent">الموافقة على سياسة الخصوصية إلزامية لإتمام الطلب</div>

    <div class="wizard-nav">
      <button class="btn btn-outline" id="prevBtn">السابق</button>
      <button class="btn" id="submitBtn">إرسال الطلب</button>
    </div>
    <div id="formMsg"></div>
  `;

  let currentDiscount = 0;
  let currentCouponCode = '';

  async function applyCoupon(){
    const code = document.getElementById('couponInput').value.trim();
    const msgEl = document.getElementById('couponMsg');
    if(!code){ return; }
    msgEl.style.color = 'var(--clr-ink-soft)'; msgEl.textContent = 'جاري التحقق...';
    const { data, error } = await supabaseClient.rpc('check_coupon', { p_code: code });
    const result = data && data[0];
    if (error || !result || !result.valid) {
      currentDiscount = 0; currentCouponCode = '';
      msgEl.style.color = 'var(--clr-primary)'; msgEl.textContent = (result && result.message) || 'تعذّر التحقق من الكوبون';
    } else {
      currentDiscount = result.discount_type === 'percent' ? Math.round(subtotal * result.discount_value/100) : Math.min(result.discount_value, subtotal);
      currentCouponCode = code;
      msgEl.style.color = 'var(--clr-teal)'; msgEl.textContent = result.message;
    }
    document.getElementById('discountRow').style.display = currentDiscount>0 ? 'flex':'none';
    document.getElementById('priceDiscount').textContent = '−'+currentDiscount+' ر.س';
    document.getElementById('priceTotal').textContent = (subtotal-currentDiscount)+' ر.س';
  }
  document.getElementById('applyCouponBtn').addEventListener('click', applyCoupon);
  if (couponCode) applyCoupon();

  document.getElementById('prevBtn').addEventListener('click', () => { currentStep--; renderStep(); });
  document.getElementById('submitBtn').addEventListener('click', () => submitOrder(subtotal, () => currentDiscount, () => currentCouponCode));
}

window.editItem = function(i){ currentStep = i + 1; renderStep(); };

/* ---------- الإرسال النهائي ---------- */
async function submitOrder(subtotal, getDiscount, getCouponCode){
  const consentEl = document.getElementById('consentPrivacy');
  if (!consentEl.checked) { toggleErr('err_consent', true); return; }
  toggleErr('err_consent', false);

  const submitBtn = document.getElementById('submitBtn');
  const msgEl = document.getElementById('formMsg');
  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="spinner"></span> جاري إنشاء الطلب...';

  const discount = getDiscount();
  const total = subtotal - discount;
  let createdRows = null;

  try {
    const itemsPayload = pendingItems.map((p, i) => {
      const d = itemsData[i];
      return {
        item_index: p.item_index,
        product_id: p.product_id,
        product_title: p.product_title,
        product_price: p.product_price,
        child_name: d.childName, child_age: d.childAge, child_gender: d.childGender,
        story_value: d.storyValue === OTHER_VALUE_LABEL ? d.storyValueOther : d.storyValue,
        dedication_type: d.dedicationType,
        dedication_text: d.dedicationType === 'default' ? DEFAULT_DEDICATION : d.dedicationCustom,
        hobby_detail: d.hobbyDetail,
        consent_privacy: true,
      };
    });

    const { data, error } = await supabaseClient.rpc('create_full_order', {
      p_parent_name: parentInfo.parentName, p_phone: parentInfo.phone, p_email: parentInfo.email, p_city: parentInfo.city,
      p_coupon_code: getCouponCode() || null, p_subtotal: subtotal, p_discount_amount: discount, p_total: total,
      p_items: itemsPayload, p_governorate: parentInfo.governorate,
    });
    if (error) throw error;
    createdRows = data;

    submitBtn.innerHTML = '<span class="spinner"></span> جاري رفع الصور...';
    for (const row of createdRows) {
      const itemIdx = pendingItems.findIndex(p => p.item_index === row.item_index);
      const files = itemsData[itemIdx].photoFiles;
      if (files && files.length) {
        const urls = await uploadMultipleToDrive(files, row.order_number);
        await supabaseClient.rpc('add_item_photos', { p_item_id: row.item_id, p_photo_urls: urls });
      }
    }

    localStorage.removeItem('batali_pending_items');
    localStorage.removeItem('batali_coupon_code');
    localStorage.removeItem('batali_wizard_progress');
    window.location.href = `order-success.html?order=${createdRows[0].order_number}&amount=${total}`;

  } catch (err) {
    if (createdRows) {
      msgEl.innerHTML = `<div class="error-box">تم إنشاء طلبك برقم <b>${createdRows[0].order_number}</b> لكن حدث خطأ أثناء رفع بعض الصور (${err.message}). احفظ رقم الطلب وتواصل معنا.</div>`;
    } else {
      msgEl.innerHTML = `<div class="error-box">تعذّر إنشاء الطلب: ${err.message}. حاول مرة أخرى.</div>`;
    }
    submitBtn.disabled = false;
    submitBtn.textContent = 'إرسال الطلب';
  }
}
</script>
