<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تتبع الطلب | بطلي</title>
<link rel="stylesheet" href="shared/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.item-track{background:var(--clr-cream);border-radius:14px;padding:16px;margin-bottom:12px;}
.item-track h4{font-size:.92rem;font-weight:800;margin-bottom:8px;}
</style>
</head>
<body>
<div class="container">
  <div class="brand">📖 <span>بطلي</span></div>

  <div class="card">
    <h2 style="margin-bottom:18px;">تتبع الطلب</h2>

    <div id="searchBox">
      <label>رقم الطلب</label>
      <input type="text" id="orderInput" placeholder="مثال: BOT-0001">
      <button class="btn btn-block" id="trackBtn" style="margin-top:14px;">تتبع</button>
    </div>

    <div id="result" style="margin-top:24px;"></div>
  </div>
</div>

<script src="shared/config.js"></script>
<script>
async function trackOrder(orderNumber) {
  const resultEl = document.getElementById('result');
  resultEl.innerHTML = '<p style="color:var(--clr-ink-soft);">جاري البحث...</p>';

  const { data: order, error: orderErr } = await supabaseClient
    .from('order_public_status')
    .select('*')
    .eq('order_number', orderNumber.trim())
    .maybeSingle();

  if (orderErr || !order) {
    resultEl.innerHTML = '<div class="error-box">لم يتم العثور على طلب بهذا الرقم. تأكد من الرقم وحاول مجدداً.</div>';
    return;
  }

  const { data: items, error: itemsErr } = await supabaseClient
    .from('order_items_public_status')
    .select('*')
    .eq('order_number', orderNumber.trim())
    .order('item_index', { ascending: true });

  const itemsHtml = (items || []).map(it => `
    <div class="item-track">
      <h4>${it.product_title}</h4>
      <span class="badge" style="background:${STATUS_COLORS[it.status]};">${STATUS_LABELS[it.status]}</span>
      <div style="font-size:.78rem;color:var(--clr-ink-soft);margin-top:6px;">آخر تحديث: ${new Date(it.updated_at).toLocaleString('ar-SA')}</div>
    </div>
  `).join('') || '<p style="color:var(--clr-ink-soft);">لا توجد تفاصيل منتجات متاحة.</p>';

  resultEl.innerHTML = `
    <div style="text-align:center;margin-bottom:16px;">
      <div style="font-size:.85rem;color:var(--clr-ink-soft);">رقم الطلب</div>
      <div style="font-size:1.3rem;font-weight:900;">${order.order_number}</div>
      <div style="font-size:.8rem;color:var(--clr-ink-soft);margin-top:6px;">تاريخ الإنشاء: ${new Date(order.created_at).toLocaleString('ar-SA')}</div>
    </div>
    ${itemsHtml}
  `;
}

document.getElementById('trackBtn').addEventListener('click', () => {
  const val = document.getElementById('orderInput').value;
  if (val.trim()) trackOrder(val);
});

const params = new URLSearchParams(location.search);
const preset = params.get('order');
if (preset) {
  document.getElementById('orderInput').value = preset;
  trackOrder(preset);
}
</script>
</body>
</html>
